[project]
name = "account-research-agent"
version = "0.1.0"
description = "Account research agent for Devin SDRs: MCP server + playbook"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "claude-agent-sdk>=0.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false  # an app run from the repo root, not an installable package

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
